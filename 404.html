<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Strip /404 or /404.html if present
        path = path.replace(/\/404(\.html)?$/, '');

        var segments = path.split('/').filter(Boolean);
        var repoName = 'fuck-off-react';

        var target;
        if (segments.length > 0 && segments[0] === repoName) {
          var route = '/' + segments.slice(1).join('/');
          target = '/' + repoName + '/#' + (route === '/' ? '' : route);
        } else if (segments.length > 0) {
          // If deployed under another repository name
          var dynamicRepo = segments[0];
          var dynamicRoute = '/' + segments.slice(1).join('/');
          target = '/' + dynamicRepo + '/#' + (dynamicRoute === '/' ? '' : dynamicRoute);
        } else {
          target = '/#' + (path === '/' ? '' : path);
        }

        window.location.replace(target + search + hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to application...</p>
  </body>
</html>
